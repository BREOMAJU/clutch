:root{--acr:255,107,10;--gd:#ffd23f;--bg:#0d0d0c;--s:#171715;--ln:#2e2d2a;--t:#f2ede3;--m:#8f8a7e;--ac:#ff6b0a;--ok:#7bd88f;--bad:#ff6a5c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.55 Archivo,system-ui,sans-serif}
#app{max-width:1200px;margin:0 auto;padding:0 20px 40px;min-height:100vh}
h1,h2,h3,.big,.logo,.num{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;text-transform:uppercase;margin:0}
h1{font-size:clamp(40px,7vw,84px);line-height:.95;margin-bottom:14px}h2{font-size:clamp(26px,4vw,42px);line-height:1;margin-bottom:10px}h3{font:600 11px/1 Archivo,sans-serif;letter-spacing:.2em;color:var(--m);margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid var(--ln)}
.logo{font-size:22px;letter-spacing:.08em}.logo b{display:inline-block;width:9px;height:9px;background:var(--ac);margin:0 8px;vertical-align:middle}.sm{font-size:11px;letter-spacing:.18em;color:var(--m);text-transform:uppercase}
.home{display:grid;grid-template-columns:1fr 1fr;min-height:72vh;border-bottom:1px solid var(--ln)}@media(max-width:760px){.home{grid-template-columns:1fr}}
.pane{position:relative;overflow:hidden;padding:32px 28px;display:flex;flex-direction:column;justify-content:flex-end;min-height:420px}.pane.l{border-right:1px solid var(--ln)}
.pane svg{position:absolute;right:-12%;top:6%;width:80%;opacity:.16}.pane.r{background:var(--ac);color:#0d0d0c}.pane.r h3,.pane.r p{color:#0d0d0c}.pane.r svg *{stroke:#0d0d0c}
.num{position:absolute;top:14px;left:24px;font-size:110px;line-height:1;color:transparent;-webkit-text-stroke:1.5px currentColor;opacity:.5}.cp{position:relative;max-width:460px}.cp p{margin:0 0 20px}
.b{background:transparent;color:var(--t);border:1px solid var(--t);padding:12px 20px;font:800 12px/1 Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .15s,color .15s,transform .15s}
.b:hover{background:var(--t);color:var(--bg)}.b:focus-visible{outline:2px solid var(--ac);outline-offset:3px}.b.pri{background:var(--ac);border-color:var(--ac);color:#0d0d0c}.b.pri:hover{background:var(--t);border-color:var(--t)}.b.on{background:var(--t);color:var(--bg)}
.pane.r .b.pri{background:#0d0d0c;border-color:#0d0d0c;color:var(--t)}.pane.r .b.pri:hover{background:transparent;color:#0d0d0c}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;text-transform:none;letter-spacing:0;font-size:15px;font-weight:600;padding:16px}
.c{border-top:1px solid var(--ln);padding:20px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));border-left:1px solid var(--ln)}.col{padding:24px 22px;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.big{font-size:84px;line-height:.9}.m{color:var(--m)}.ok{color:var(--ok)}.bad{color:var(--bad)}.ac{color:var(--ac)}
.bar{height:3px;background:var(--ln)}.bar i{display:block;height:100%;background:var(--ac)}.kv{display:flex;justify-content:space-between;border-top:1px solid var(--ln);padding:8px 0;font-size:13px}.kv b{font-weight:800}
.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--m);margin-right:12px}
input[type=text]{width:100%;background:transparent;color:var(--t);border:0;border-bottom:2px solid var(--ln);padding:10px 0;font:400 28px Anton,Impact,sans-serif;text-transform:uppercase;outline:none}input[type=text]:focus{border-color:var(--ac)}
ul{margin:6px 0 10px;padding-left:18px}.tr{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:baseline;border-top:1px solid var(--ln);padding:12px 0}
.in{animation:in .5s ease-out both}.up{animation:pop .7s ease-out both}@keyframes in{from{opacity:0;transform:translateY(14px)}}@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
table{border-collapse:collapse;width:100%;min-width:760px}th{font:600 11px Archivo,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--m);text-align:left;padding:10px 8px;border-bottom:1px solid var(--ln)}td{padding:10px 8px;border-bottom:1px solid var(--ln);font-variant-numeric:tabular-nums}.cl{display:flex;align-items:center;gap:10px;font-weight:600}tr.cur td{background:var(--s);color:var(--ac)}tr.new td{background:rgba(var(--acr),.08)}.w{overflow-x:auto}
.tov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(13,13,12,.8);transition:opacity .5s;cursor:pointer}.tov.out{opacity:0}.tov h2{position:absolute;top:7vh;width:100%;text-align:center;margin:0;color:var(--ac)}
.tin{display:flex;flex-wrap:wrap;gap:26px 34px;justify-content:center;max-width:92vw;padding:20px}
.tro{text-align:center;animation:tpop .85s cubic-bezier(.2,1.5,.4,1) both;max-width:210px}.tro svg{filter:drop-shadow(0 0 22px rgba(255,210,63,.5))}.tro.i svg{filter:drop-shadow(0 0 22px rgba(176,123,255,.55))}
.tro b{display:block;font:400 22px/1.1 Anton,Impact,sans-serif;text-transform:uppercase;margin-top:10px}.tro span{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--m);margin-top:4px}
@keyframes tpop{0%{transform:translateY(70px) scale(.3);opacity:0}100%{transform:none;opacity:1}}
.chip{display:inline-flex;align-items:center;gap:6px;margin:2px 12px 2px 0;font-size:12px;white-space:nowrap}

a.b{text-decoration:none;display:inline-block}
.shm{position:fixed;inset:0;z-index:60;background:rgba(13,13,12,.9);display:flex;justify-content:center;overflow:auto;padding:max(20px,env(safe-area-inset-top,0px)) 20px max(20px,env(safe-area-inset-bottom,0px))}
.shb{background:var(--s);border:1px solid var(--ln);max-width:560px;width:100%;padding:20px;margin:auto}
.shp{display:flex;justify-content:center;align-items:center;background:var(--bg);border:1px solid var(--ln);padding:10px;min-height:160px}.shp img{max-width:100%;max-height:50vh;height:auto;display:block}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--ln);flex:none;display:inline-block}
.code{font:400 clamp(40px,10vw,72px)/1 Anton,Impact,sans-serif;letter-spacing:.08em;color:var(--ac);margin:4px 0 10px}
.fr{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;border-top:1px solid var(--ln);padding:12px 0}
.num2{font:400 34px/1 Anton,Impact,sans-serif}
@media(max-width:760px){.w{overflow:visible}table{min-width:0;display:block}tbody{display:block}tr.hd{display:none}
tr{display:grid;grid-template-columns:auto auto 1fr;grid-template-areas:"cc cc gr" "tmp ag dl" "nt nt nt" "tc tc tc";column-gap:14px;row-gap:5px;align-items:center;border-bottom:1px solid var(--ln);padding:14px 6px}
td{display:block;padding:0;border:0;background:transparent!important}td:empty{display:none}
td.cc{grid-area:cc}td.gr{grid-area:gr;justify-self:end;font-size:18px;white-space:nowrap}td.tmp{grid-area:tmp;color:var(--m);font-size:13px}td.ag{grid-area:ag;color:var(--m);font-size:13px}td.dl{grid-area:dl;justify-self:end;font-size:14px;font-weight:800}td.nt{grid-area:nt;font-size:12px}td.tc{grid-area:tc}
tr.new{background:rgba(var(--acr),.08)}tr.cur{background:var(--s)}tr.ph{grid-template-areas:"tmp cc cc"}tr.ph td.ag,tr.ph td.gr{display:none}}
.hero{position:relative;overflow:hidden;margin:18px 0;padding:26px 22px 22px;border:1px solid var(--ln);background:radial-gradient(ellipse at 85% 0%,rgba(var(--acr),.24),transparent 62%),linear-gradient(135deg,#1d1c19,#0d0d0c)}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--ac)}.hero::after{content:"";position:absolute;right:-100px;bottom:-100px;width:300px;height:300px;border:3px solid rgba(var(--acr),.13);border-radius:50%;box-shadow:0 0 0 44px rgba(var(--acr),.05);pointer-events:none}
